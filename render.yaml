services:
  - type: web
    name: learnos-ai-platform
    env: python
    buildCommand: "pip install -r requirements.txt && python database/seed.py"
    startCommand: "gunicorn app:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
