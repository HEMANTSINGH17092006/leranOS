{% extends "base.html" %}

{% block title %}500 - Internal Server Error - LearnOS{% endblock %}

{% block content %}
<div class="card-custom text-center py-5">
  <div class="avatar-circle mx-auto mb-3" style="width: 72px; height: 72px; background: var(--warning-light); color: var(--warning); font-size: 2rem;">
    <i class="bi bi-gear-wide-connected"></i>
  </div>
  <h2 class="fw-bold text-dark mb-2">500 - Internal Server Error</h2>
  <p class="text-muted small mb-4">Something unexpected happened on our server. Our ML telemetry has captured the event.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
