{% extends "base.html" %}

{% block title %}404 - Page Not Found - LearnOS{% endblock %}

{% block content %}
<div class="card-custom text-center py-5">
  <div class="avatar-circle mx-auto mb-3" style="width: 72px; height: 72px; background: var(--danger-light); color: var(--danger); font-size: 2rem;">
    <i class="bi bi-exclamation-octagon"></i>
  </div>
  <h2 class="fw-bold text-dark mb-2">404 - Page Not Found</h2>
  <p class="text-muted small mb-4">The learning module or page you are looking for does not exist or has moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
